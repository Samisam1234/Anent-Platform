server:
  port: 8080

spring:
  application:
    name: agent-platform

  # ── Default: In-memory H2 ──────────────────────────────────────────
  datasource:
    url: jdbc:h2:mem:agentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    h2:
      console:
        enabled: true
    database-platform: com.agentplatform.memory.dialect.H2VectorDialect
    ddl-auto: update

  # ── Virtual threads (Java 21) — improves throughput for blocking LLM calls ─
  threads:
    virtual:
      enabled: true

# ── Ollama AI Model Configuration ────────────────────────────────────
# These values are read by OllamaProperties and OllamaConfig in agent-core.
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  # The model name MUST match a model that actually exists in the local Ollama
  # installation. Verify with:  ollama list
  # A name that has not been pulled fails at call time with
  # "model '<name>' not found" — the app then falls back to the deterministic
  # parser, so nothing crashes but no AI profile is produced.
  #
  # Override per machine without editing this file:
  #   OLLAMA_CHAT_MODEL=<exact name from `ollama list`>
  # e.g. llama3.2:3b, qwen2.5:1.5b — use whatever `ollama list` shows.
  chat-model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  # Request timeout for AI reasoning calls (default 5 minutes).
  # Cold-start model loads on CPU can exceed this; increase if needed.
  # A value of 0 or less is treated as "not configured" by ResumeProfileService,
  # which then uses OllamaChatModelFactory.DEFAULT_TIMEOUT.
  reasoning-timeout: 300s

# ── Groq AI Model Configuration ──────────────────────────────────────
# Groq provides OpenAI-compatible API for fast inference.
# These values are read by GroqProperties and GroqProvider in agent-core.
groq:
  enabled: false
  # API key from https://console.groq.com/keys
  # Override without editing this file: GROQ_API_KEY=<your-key>
  api-key: ${GROQ_API_KEY:}
  # Base URL for Groq's OpenAI-compatible endpoint.
  base-url: https://api.groq.com/openai/v1
  # Model name must match a model available on Groq.
  # Current recommended model: openai/gpt-oss-20b
  chat-model: openai/gpt-oss-20b
  # Request timeout for AI reasoning calls (default 2 minutes).
  reasoning-timeout: 120s

# ── OpenRouter AI Model Configuration ────────────────────────────────
# OpenRouter provides OpenAI-compatible API with access to multiple models.
# These values are read by OpenRouterProperties and OpenRouterProvider in agent-core.
openrouter:
  enabled: false
  # API key from https://openrouter.ai/keys
  # Override without editing this file: OPENROUTER_API_KEY=<your-key>
  api-key: ${OPENROUTER_API_KEY:}
  # Base URL for OpenRouter's OpenAI-compatible endpoint.
  base-url: https://openrouter.ai/api/v1
  # Model name must match a model available on OpenRouter.
  # Current recommended model: openrouter/auto
  chat-model: openrouter/auto
  # Request timeout for AI reasoning calls (default 2 minutes).
  reasoning-timeout: 120s

# ── Cerebras AI Model Configuration ──────────────────────────────────
# Cerebras provides OpenAI-compatible API for fast inference.
# These values are read by CerebrasProperties and CerebrasProvider in agent-core.
cerebras:
  enabled: false
  # API key from https://cloud.cerebras.ai/
  # Override without editing this file: CEREBRAS_API_KEY=<your-key>
  api-key: ${CEREBRAS_API_KEY:}
  # Base URL for Cerebras's OpenAI-compatible endpoint.
  base-url: https://api.cerebras.ai/v1
  # Model name must match a model available on Cerebras.
  # Current recommended model: llama3.1-8b
  chat-model: llama3.1-8b
  # Request timeout for AI reasoning calls (default 2 minutes).
  reasoning-timeout: 120s

# ── Global LLM Routing Configuration ──────────────────────────────────
# Controls which provider is used by default when no explicit provider is requested.
# When not set, the highest-priority configured provider is used (Ollama > Gemini > Groq).
llm:
  # Default provider name: "ollama", "gemini", or "groq".
  # Override without editing this file: LLM_DEFAULT_PROVIDER=<provider>
  default-provider: ${LLM_DEFAULT_PROVIDER:}

# ── Conversation Store Configuration ──────────────────────────────────
# Select the ConversationStore implementation:
#   inmemory  - In-memory store (default, survives browser navigation but not JVM restart)
#   persistent - JPA-backed store (requires datasource, survives JVM restart)
conversation:
  store: inmemory

# ── Job Sources ────────────────────────────────────────────────────────
# Job discovery runs through JobAggregatorService, which calls every enabled
# JobSourceProvider in parallel (CompletableFuture), isolates per-provider
# failures, merges and deduplicates the listings, and hands them to the existing
# matching pipeline. No single board is privileged: each Job keeps its own
# `source`, `sourceUrl` and `applicationUrl`, so "View Source Listing" always
# opens that specific job's originating page.
#
# Every provider fails safe: unreachable, rate-limited or mis-configured, it logs
# a warning and contributes nothing. The UI then shows a professional empty
# state — never fabricated jobs. The result's `live` flag only reports true when
# a live provider actually contributed listings.
#
# The development MockJobSource is NOT registered as a bean unless
# job-sources.mock.enabled=true, so MOCK_SOURCE rows cannot reach the Jobs portal,
# Matches, Career Agent, Application Advisor or Prepare Application. Automated
# tests keep full access by constructing `new MockJobSource()` directly.
#
# Override without touching this file:
#   JOB_SOURCES_PUBLIC_API_ENABLED=false   disable Remotive
#   JOB_SOURCES_ARBEITNOW_ENABLED=false    disable Arbeitnow
#   ADZUNA_APP_ID / ADZUNA_APP_KEY         Adzuna credentials (free, developer.adzuna.com)
# Never hard-code credentials. Remotive's and Arbeitnow's public feeds need no key.
job-sources:
  # Remotive — free public feed, no credentials required.
  public-api:
    enabled: true
    base-url: https://remotive.com/api/remote-jobs
    api-key: ""
  # Arbeitnow — free public feed, no credentials. Rate-limited to 3 requests,
  # so one page (100 listings) is fetched per search.
  arbeitnow:
    enabled: true
    base-url: https://www.arbeitnow.com/api/job-board-api
    max-pages: 1
  # Adzuna — requires a free app_id/app_key pair. Without them the provider
  # reports itself unavailable and is skipped before any network call, with the
  # missing-credential reason logged. Credentials come from the environment only.
  adzuna:
    enabled: true
    base-url: https://api.adzuna.com/v1/api/jobs
    country: ${ADZUNA_COUNTRY:gb}
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    results-per-page: 50
    max-pages: 1
  mock:
    enabled: false
  openings-mcp:
    enabled: false
    base-url: http://localhost:9000/
    timeout-seconds: 15
    country-code: IND
    include-google: true
    include-amazon: true
    include-apple: true
    include-meta: true

# ── Logging ──────────────────────────────────────────────────────────
logging:
  level:
    com.agentplatform: INFO
    dev.langchain4j: WARN
  app:
    # Master switch for the Phase 8.3 centralized correlated logging
    # (LoggingContext, MDC runId, lifecycle logging). Independent of logging.level.
    enabled: true

# ── RAG Service (Phase 8.2) ──────────────────────────────────────────
# Standalone retrieval-augmented generation foundation. Dormant unless
#   rag.enabled=true AND SPRING_PROFILES_ACTIVE=postgres
# (rag-service is not yet wired into the bootable app).
rag:
  enabled: false
  chunk:
    max-size: 1000          # max characters per chunk
    overlap: 100            # characters of overlap carried between chunks
  retrieval:
    similarity-threshold: 0.0   # 1 - cosine_distance; minimum score for returned chunks
    max-context-tokens: 2000    # token budget for retrieveForContext()


# ──────────────────────────────────────────────────────────────────
# ── PostgreSQL / pgvector (activate with SPRING_PROFILES_ACTIVE=postgres) ─
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/agentdb
    username: agent
    password: agentpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: com.agentplatform.memory.dialect.PostgresVectorDialect
    ddl-auto: update
