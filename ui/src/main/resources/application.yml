server:
  port: 8080

spring:
  application:
    name: agent-platform

  # ── Default: In-memory H2 ──────────────────────────────────────────
  datasource:
    url: jdbc:h2:mem:agentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    h2:
      console:
        enabled: true
    database-platform: com.agentplatform.memory.dialect.H2VectorDialect
    ddl-auto: update

  # ── Virtual threads (Java 21) — improves throughput for blocking LLM calls ─
  threads:
    virtual:
      enabled: true

# ── Ollama AI Model Configuration ────────────────────────────────────
# These values are read by OllamaProperties and OllamaConfig in agent-core.
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  # The model name MUST match a model that actually exists in the local Ollama
  # installation. Verify with:  ollama list
  # A name that has not been pulled fails at call time with
  # "model '<name>' not found" — the app then falls back to the deterministic
  # parser, so nothing crashes but no AI profile is produced.
  #
  # Override per machine without editing this file:
  #   OLLAMA_CHAT_MODEL=<exact name from `ollama list`>
  # e.g. gemma3:4b, llama3.1:8b, qwen2.5:3b — use whatever `ollama list` shows.
  # HARDWARE NOTE: gemma3:4b fits comfortably in 8 GB RAM; do not select a larger
  # model without sufficient RAM.
  chat-model: ${OLLAMA_CHAT_MODEL:gemma3:4b}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  # Request timeout for AI reasoning calls (default 2 minutes).
  # Cold-start model loads on CPU can exceed this; increase if needed.
  # A value of 0 or less is treated as "not configured" by ResumeProfileService,
  # which then uses OllamaChatModelFactory.DEFAULT_TIMEOUT.
  reasoning-timeout: 120s

# ── Conversation Store Configuration ──────────────────────────────────
# Select the ConversationStore implementation:
#   inmemory  - In-memory store (default, survives browser navigation but not JVM restart)
#   persistent - JPA-backed store (requires datasource, survives JVM restart)
conversation:
  store: inmemory

# ── Job Sources ────────────────────────────────────────────────────────
# PublicApiJobSource (Remotive) is the only source in the normal user-facing flow.
# It fails safe: if the provider is unreachable it logs a warning and returns no
# listings, and the UI then shows a professional empty state — never fabricated
# jobs. The result's `live` flag only reports true when a live source actually
# contributed listings.
#
# The development MockJobSource is NOT registered as a bean unless
# job-sources.mock.enabled=true, so MOCK_SOURCE rows cannot reach the Jobs portal,
# Matches, Career Agent, Application Advisor or Prepare Application. Automated
# tests keep full access by constructing `new MockJobSource()` directly.
# Override without touching this file:
#   JOB_SOURCES_PUBLIC_API_ENABLED=false  to disable the live source
#   JOB_SOURCES_PUBLIC_API_API_KEY=<key>  if a provider ever requires one
# Never hard-code credentials. Remotive's public feed needs no key.
job-sources:
  public-api:
    enabled: true
    base-url: https://remotive.com/api/remote-jobs
    api-key: ""
  mock:
    enabled: false

# ── Logging ──────────────────────────────────────────────────────────
logging:
  level:
    com.agentplatform: INFO
    dev.langchain4j: WARN
  app:
    # Master switch for the Phase 8.3 centralized correlated logging
    # (LoggingContext, MDC runId, lifecycle logging). Independent of logging.level.
    enabled: true

# ── RAG Service (Phase 8.2) ──────────────────────────────────────────
# Standalone retrieval-augmented generation foundation. Dormant unless
#   rag.enabled=true AND SPRING_PROFILES_ACTIVE=postgres
# (rag-service is not yet wired into the bootable app).
rag:
  enabled: false
  chunk:
    max-size: 1000          # max characters per chunk
    overlap: 100            # characters of overlap carried between chunks
  retrieval:
    similarity-threshold: 0.0   # 1 - cosine_distance; minimum score for returned chunks
    max-context-tokens: 2000    # token budget for retrieveForContext()


# ──────────────────────────────────────────────────────────────────
# ── PostgreSQL / pgvector (activate with SPRING_PROFILES_ACTIVE=postgres) ─
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/agentdb
    username: agent
    password: agentpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: com.agentplatform.memory.dialect.PostgresVectorDialect
    ddl-auto: update
